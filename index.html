<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM Scanner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <!-- Camera Viewport -->
        <div id="camera-container">
            <video id="video-preview" autoplay playsinline></video>
            <canvas id="hidden-canvas" style="display:none;"></canvas>
        </div>

        <!-- Floating UI -->
        <div class="controls-overlay">
            <div class="action-buttons">
                <button id="scan-doc-btn" class="btn-primary">📄 Scan Document</button>
                <button id="scan-id-btn" class="btn-secondary">🪪 Scan ID</button>
            </div>
            <nav class="bottom-nav">
                <button>📁 Import</button>
                <button>⚙ Settings</button>
                <button>🕒 History</button>
            </nav>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/lib/opencv.js"></script>
    <script src="assets/lib/pdf-lib.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
