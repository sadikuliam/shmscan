<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM Scanner Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #loading-bar { position: fixed; top: 0; left: 0; height: 5px; width: 0%; background: #f43f5e; transition: width 0.4s ease; z-index: 9999; }
        .header { padding: 1rem; text-align: center; font-size: 1.5rem; font-weight: 900; background: linear-gradient(to right, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .step { display: none; flex-direction: column; padding: 20px; gap: 15px; }
        .step.active { display: flex; }
        .btn { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 1.2rem; border-radius: 15px; font-weight: bold; cursor: pointer; text-align: center; margin-bottom: 10px; }
        .btn-id { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .btn-rotate { background: #3b82f6; }
        .editor-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; min-height: 400px; position: relative; }
        
        /* Blue Square Handles */
        .cropper-point { background-color: #3b82f6 !important; width: 25px !important; height: 25px !important; opacity: 1 !important; border: 2px solid white; border-radius: 5px; }
    </style>
</head>
<body>

<div id="loading-bar"></div>
<div class="header">SHM SCANNER PRO</div>

<!-- Step 1 -->
<div id="step-1" class="step active">
    <label class="btn">📸 Scan Document (A4) 
        <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="prepareEdit(event, 'doc')">
    </label>
    <label class="btn btn-id">🪪 Scan ID Card (Both Side)
        <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="prepareEdit(event, 'id')">
    </label>
</div>

<!-- Step 2 -->
<div id="step-2" class="step">
    <div class="editor-container"><img id="editor-img" style="max-width:100%"></div>
    <button class="btn" style="width:100%" onclick="savePage()">✅ Crop & Confirm</button>
</div>

<!-- Step 3 -->
<div id="step-3" class="step">
    <h3 style="text-align:center;">Pages: <span id="page-count">0</span></h3>
    <button class="btn btn-rotate" onclick="rotateLastPage()">🔄 Rotate Last Page</button>
    <button class="btn btn-id" onclick="goToStep(1)">➕ Add Another Page</button>
    <button class="btn" style="background:#059669" onclick="downloadPDF()">📥 Download PDF</button>
    <button class="btn" style="background:#334155" onclick="sharePDF()">✈️ Share WhatsApp</button>
    <button class="btn" onclick="window.location.reload()">🏠 Start Over</button>
</div>

<script>
    let pages = []; let cropper; let scanMode = 'doc';

    function setLoading(isLoading) { document.getElementById('loading-bar').style.width = isLoading ? '100%' : '0%'; }

    function goToStep(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step-'+s).classList.add('active');
    }

    // রেজাল্ট পেজে রোটেট করার জন্য
    function rotateLastPage() {
        if (pages.length === 0) return;
        setLoading(true);
        const img = new Image();
        img.src = pages[pages.length - 1];
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.height;
            canvas.height = img.width;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(90 * Math.PI / 180);
            ctx.drawImage(img, -img.width / 2, -img.height / 2);
            pages[pages.length - 1] = canvas.toDataURL('image/jpeg', 0.7);
            setLoading(false);
            alert("Page Rotated!");
        };
    }

    function prepareEdit(e, mode) {
        scanMode = mode;
        const reader = new FileReader();
        reader.onload = (ev) => {
            goToStep(2);
            const img = document.getElementById('editor-img');
            img.src = ev.target.result;
            if(cropper) cropper.destroy();
            
            // A4 ratio: 1/1.414
            cropper = new Cropper(img, { 
                aspectRatio: mode === 'doc' ? 1/1.414 : 1.58, 
                viewMode: 2,
                autoCropArea: 1, 
                responsive: true
            });
        };
        reader.readAsDataURL(e.target.files[0]);
        e.target.value = '';
    }

    function savePage() {
        setLoading(true);
        const canvas = cropper.getCroppedCanvas({ width: 1240, height: 1754 }); 
        pages.push(canvas.toDataURL('image/jpeg', 0.7)); 
        if(cropper) cropper.destroy();
        
        if(scanMode === 'id' && pages.length < 2) {
            alert("Front side saved! Now capture the back side.");
            goToStep(1);
            setLoading(false);
        } else {
            document.getElementById('page-count').innerText = pages.length;
            goToStep(3);
            setLoading(false);
        }
    }

    async function processPDF() {
        setLoading(true);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        if (scanMode === 'id' && pages.length >= 2) {
            pdf.addImage(pages[0], 'JPEG', 10, 10, 190, 120);
            pdf.addImage(pages[1], 'JPEG', 10, 140, 190, 120);
        } else {
            pages.forEach((p, i) => {
                if(i > 0) pdf.addPage();
                pdf.addImage(p, 'JPEG', 0, 0, 210, 297);
            });
        }
        return pdf;
    }

    async function downloadPDF() {
        const pdf = await processPDF();
        pdf.save("SHM_Scan.pdf");
        setLoading(false);
    }

    async function sharePDF() {
        const pdf = await processPDF();
        const blob = pdf.output('blob');
        const file = new File([blob], "SHM_Document.pdf", { type: "application/pdf" });
        if (navigator.share) {
            try { await navigator.share({ files: [file], title: 'SHM Scan' }); }
            catch(err) { alert("Sharing failed."); downloadPDF(); }
        } else {
            downloadPDF();
        }
        setLoading(false);
    }
</script>
</body>
</html>
