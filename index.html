<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM Scanner Pro</title>
    <!-- Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #6366f1; --accent: #f43f5e; --bg: #0f172a; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 1rem; text-align: center; font-size: 1.5rem; font-weight: 900; background: linear-gradient(to right, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .step { display: none; flex-direction: column; padding: 20px; gap: 15px; }
        .step.active { display: flex; }
        .btn { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 1.2rem; border-radius: 15px; font-weight: bold; cursor: pointer; text-align: center; margin-bottom: 10px; }
        .btn-id { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .btn-action { background: #334155; }
        .editor-container { flex: 1; min-height: 300px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header">SHM SCANNER PRO</div>

<!-- Step 1: Home -->
<div id="step-1" class="step active">
    <label class="btn">📸 Scan Document (A4) 
        <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="prepareEdit(event, 'doc')">
    </label>
    <label class="btn btn-id">🪪 Scan ID Card (Both Side)
        <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="prepareEdit(event, 'id')">
    </label>
</div>

<!-- Step 2: Edit/Crop -->
<div id="step-2" class="step">
    <div class="editor-container"><img id="editor-img" style="max-width:100%"></div>
    <button class="btn" onclick="savePage()">✅ Save & Confirm</button>
</div>

<!-- Step 3: Results -->
<div id="step-3" class="step">
    <h3 style="text-align:center;">Document Ready!</h3>
    <button class="btn" style="background:#059669" onclick="downloadPDF()">📥 Download PDF</button>
    <button class="btn" onclick="sharePDF()">✈️ Share WhatsApp</button>
    <button class="btn btn-action" onclick="window.location.reload()">🏠 Start Over</button>
</div>

<script>
    let pages = []; let cropper; let scanMode = 'doc';

    function prepareEdit(e, mode) {
        scanMode = mode;
        const reader = new FileReader();
        reader.onload = (ev) => {
            document.getElementById('step-1').classList.remove('active');
            document.getElementById('step-2').classList.add('active');
            const img = document.getElementById('editor-img');
            img.src = ev.target.result;
            if(cropper) cropper.destroy();
            cropper = new Cropper(img, { aspectRatio: mode === 'doc' ? 1/1.414 : 1.58, viewMode: 1 });
        };
        reader.readAsDataURL(e.target.files[0]);
        e.target.value = '';
    }

    function savePage() {
        const canvas = cropper.getCroppedCanvas({ width: 2480, height: 3508 });
        pages.push(canvas.toDataURL('image/jpeg', 1.0));
        
        if(cropper) cropper.destroy();

        if(scanMode === 'id' && pages.length < 2) {
            alert("Front side saved! Now capture the back side.");
            document.getElementById('step-2').classList.remove('active');
            document.getElementById('step-1').classList.add('active');
        } else {
            document.getElementById('step-2').classList.remove('active');
            document.getElementById('step-3').classList.add('active');
        }
    }

    async function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        
        if (scanMode === 'id' && pages.length >= 2) {
            pdf.addImage(pages[0], 'JPEG', 10, 10, 190, 120);
            pdf.addImage(pages[1], 'JPEG', 10, 140, 190, 120);
        } else {
            pages.forEach((p, i) => {
                if(i > 0) pdf.addPage();
                pdf.addImage(p, 'JPEG', 0, 0, 210, 297);
            });
        }
        pdf.save("SHM_Scan.pdf");
    }

    async function sharePDF() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        
        if (scanMode === 'id' && pages.length >= 2) {
            pdf.addImage(pages[0], 'JPEG', 10, 10, 190, 120);
            pdf.addImage(pages[1], 'JPEG', 10, 140, 190, 120);
        } else {
            pages.forEach((p, i) => { 
                if(i > 0) pdf.addPage(); 
                pdf.addImage(p, 'JPEG', 0, 0, 210, 297); 
            });
        }
        
        const blob = pdf.output('blob');
        const file = new File([blob], "SHM_Document.pdf", { type: "application/pdf" });
        
        if (navigator.share) {
            await navigator.share({ files: [file], title: 'SHM Scan' });
        } else {
            alert("Sharing not supported, downloading instead.");
            downloadPDF();
        }
    }
</script>
</body>
</html>
